name: Deploy SwasthyaMitra Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'swasthya_mitra_app/frontend/**'
      - '.github/workflows/frontend-deploy.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'swasthya_mitra_app/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd swasthya_mitra_app/frontend
          npm ci

      - name: Build Optimized React Production App
        run: |
          cd swasthya_mitra_app/frontend
          CI=false npm run build

      - name: Deploy Build Bundle to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: swasthya_mitra_app/frontend/build
          branch: gh-pages
